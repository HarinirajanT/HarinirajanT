name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation SVG
        uses: Platane/snk@v3
        with:
          github_user_name: HarinirajanT
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%230E8A8A&color_dots=%23EBEDF0,%239BE9A8,%2340C463,%2330A14E,%23216E39
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2322D3EE&color_dots=%23161B22,%230E4429,%23006D32,%2326A641,%2339D353&color_dark=%23161B22

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
