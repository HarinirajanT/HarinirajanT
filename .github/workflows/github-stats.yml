name: Generate GitHub Stats Cards

on:
  schedule:
    - cron: "30 0 * * *"   # runs daily, 30 min after the snake workflow
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create assets folder
        run: mkdir -p assets

      - name: Download stats card
        continue-on-error: true
        run: |
          curl -sfL --retry 6 --retry-delay 15 --retry-all-errors \
            "https://github-readme-stats.vercel.app/api?username=HarinirajanT&show_icons=true&hide_border=true&bg_color=050B14&title_color=22D3EE&icon_color=38BDF8&text_color=93C5FD&ring_color=818CF8" \
            -o assets/stats.svg

      - name: Download top languages card
        continue-on-error: true
        run: |
          curl -sfL --retry 6 --retry-delay 15 --retry-all-errors \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=HarinirajanT&layout=compact&hide_border=true&bg_color=050B14&title_color=22D3EE&text_color=93C5FD" \
            -o assets/top-langs.svg

      - name: Download streak card
        continue-on-error: true
        run: |
          curl -sfL --retry 6 --retry-delay 15 --retry-all-errors \
            "https://github-readme-streak-stats.herokuapp.com/?user=HarinirajanT&hide_border=true&background=050B14&stroke=22D3EE&ring=38BDF8&fire=818CF8&currStreakLabel=22D3EE&currStreakNum=93C5FD&sideNums=93C5FD&sideLabels=93C5FD&dates=6B90B0" \
            -o assets/streak.svg

      - name: Commit and push whatever succeeded
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A assets/
          git diff --staged --quiet || git commit -m "chore: refresh stats cards [skip ci]"
          git push
