<svg width="1280" height="365" viewBox="0 0 1280 365" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <clipPath id="bannerClip"><rect width="1280" height="365" rx="20"/></clipPath>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1280" y2="365" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#0E1216"/>
    <stop offset="100%" stop-color="#141A20"/>
  </linearGradient>
  <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#F2A93C"><animate attributeName="offset" values="0;0.3;0" dur="4s" repeatCount="indefinite"/></stop>
    <stop offset="50%" stop-color="#3FB9A6"/>
    <stop offset="100%" stop-color="#F2A93C"><animate attributeName="offset" values="1;0.7;1" dur="4s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3FB9A6" stop-opacity="0"/>
    <stop offset="50%" stop-color="#3FB9A6" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#3FB9A6" stop-opacity="0"/>
  </linearGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="1.2" cy="1.2" r="1.2" fill="#F4F3EF" fill-opacity="0.035"/>
  </pattern>
</defs>

<style>
  text{font-family:'JetBrains Mono','Courier New',monospace;}
  .disp{font-family:'Trebuchet MS','Segoe UI',sans-serif;font-weight:700;}
  .role{opacity:0;}
  .pill{opacity:0;animation:pop .5s ease forwards;}
  .pill1{animation-delay:2.2s;} .pill2{animation-delay:2.4s;} .pill3{animation-delay:2.6s;}
  .pill4{animation-delay:2.8s;} .pill5{animation-delay:3.0s;} .pill6{animation-delay:3.2s;}
  @keyframes pop{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .code-line{opacity:0;animation:fadein .4s ease forwards;}
  .cl1{animation-delay:1.0s;} .cl2{animation-delay:1.4s;} .cl3{animation-delay:1.8s;}
  .cl4{animation-delay:2.2s;} .cl5{animation-delay:2.6s;} .cl6{animation-delay:3.0s;}
  @keyframes fadein{to{opacity:1;}}
  .spark{animation:float 6s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0);opacity:.6;}50%{transform:translateY(-14px);opacity:1;}}
  .cursor{animation:blink 1s step-end infinite;}
  .cursor2{animation:blink 1s step-end infinite 3.4s;}
  @keyframes blink{50%{opacity:0;}}
  .titlegrp{opacity:0;animation:riseIn .8s ease forwards .15s;}
  @keyframes riseIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .pulse-dot{animation:pulse 2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .branch{opacity:0;animation:fadein .5s ease forwards 3.6s;}
  .footer-line{opacity:0;animation:fadein .5s ease forwards 3.8s;}
</style>

<g clip-path="url(#bannerClip)">
  <rect width="1280" height="365" fill="url(#bgGrad)"/>
  <rect width="1280" height="365" fill="url(#dots)"/>
  <rect width="1280" height="365" fill="none" stroke="#F2A93C" stroke-opacity="0.15" stroke-width="1" rx="20"/>

  <!-- ambient particles -->
  <circle class="spark" cx="1180" cy="80" r="2.5" fill="#3FB9A6" style="animation-delay:.5s"/>
  <circle class="spark" cx="1120" cy="330" r="2" fill="#F2A93C" style="animation-delay:1.5s"/>
  <circle class="spark" cx="60" cy="60" r="2" fill="#3FB9A6" style="animation-delay:2.5s"/>
  <circle class="spark" cx="30" cy="360" r="2.5" fill="#F2A93C" style="animation-delay:0s"/>
  <circle class="spark" cx="900" cy="50" r="1.8" fill="#3FB9A6" style="animation-delay:3s"/>
  <circle class="spark" cx="590" cy="70" r="1.8" fill="#F2A93C" style="animation-delay:1s"/>

  <!-- terminal typing line -->
  <text x="48" y="52" font-size="14" fill="#3FB9A6">
    <tspan>&gt; user@harini:~$ cat README.md</tspan>
  </text>
  <rect class="cursor" x="292" y="41" width="8" height="14" fill="#3FB9A6"/>

  <!-- git branch chip, top right of terminal row -->
  <g class="branch">
    <rect x="1120" y="34" width="112" height="26" rx="13" fill="#F4F3EF" fill-opacity="0.05" stroke="#F4F3EF" stroke-opacity="0.12"/>
    <circle cx="1136" cy="47" r="3" fill="#3FB9A6"/>
    <text x="1148" y="51" font-size="11" fill="#C9C7BE">main · v2</text>
  </g>

  <!-- name with animated gradient -->
  <g class="titlegrp">
    <text class="disp" x="48" y="150" font-size="64" fill="url(#nameGrad)">Harini T</text>
    <rect x="50" y="164" width="220" height="2" fill="#F2A93C" fill-opacity="0.4"/>
  </g>

  <!-- cycling role titles -->
  <text class="role" x="50" y="188" font-size="20" fill="#C9C7BE">
    <tspan>Agentic AI Engineer</tspan>
    <animate attributeName="opacity" values="0;1;1;0;0;0;0;0" keyTimes="0;0.05;0.2;0.25;0.5;0.75;0.95;1" dur="8s" begin="1s" repeatCount="indefinite"/>
  </text>
  <text class="role" x="50" y="188" font-size="20" fill="#C9C7BE">
    <tspan>Full-Stack Developer</tspan>
    <animate attributeName="opacity" values="0;0;0;1;1;0;0;0" keyTimes="0;0.2;0.25;0.3;0.45;0.5;0.95;1" dur="8s" begin="1s" repeatCount="indefinite"/>
  </text>
  <text class="role" x="50" y="188" font-size="20" fill="#C9C7BE">
    <tspan>Builder of CareerPilot-AI</tspan>
    <animate attributeName="opacity" values="0;0;0;0;0;1;1;0" keyTimes="0;0.45;0.5;0.55;0.7;0.75;0.95;1" dur="8s" begin="1s" repeatCount="indefinite"/>
  </text>

  <!-- tagline quote box -->
  <rect x="48" y="212" width="480" height="46" rx="8" fill="#F4F3EF" fill-opacity="0.04" stroke="#F4F3EF" stroke-opacity="0.12"/>
  <text x="64" y="240" font-size="13" fill="#F2A93C">"Building systems that decide, not just reply."</text>

  <!-- tech pills -->
  <g font-size="12" fill="#F4F3EF">
    <rect class="pill pill1" x="48" y="278" width="70" height="28" rx="14" fill="#F4F3EF" fill-opacity="0.06"/><text class="pill pill1" x="60" y="296">Python</text>
    <rect class="pill pill2" x="126" y="278" width="80" height="28" rx="14" fill="#F4F3EF" fill-opacity="0.06"/><text class="pill pill2" x="138" y="296">FastAPI</text>
    <rect class="pill pill3" x="214" y="278" width="90" height="28" rx="14" fill="#F4F3EF" fill-opacity="0.06"/><text class="pill pill3" x="226" y="296">LangChain</text>
    <rect class="pill pill4" x="312" y="278" width="70" height="28" rx="14" fill="#F4F3EF" fill-opacity="0.06"/><text class="pill pill4" x="324" y="296">React</text>
    <rect class="pill pill5" x="390" y="278" width="88" height="28" rx="14" fill="#F4F3EF" fill-opacity="0.06"/><text class="pill pill5" x="402" y="296">LangGraph</text>
    <rect class="pill pill6" x="486" y="278" width="80" height="28" rx="14" fill="#F4F3EF" fill-opacity="0.06"/><text class="pill pill6" x="498" y="296">FullStack</text>
  </g>



  <!-- code card -->
  <rect x="620" y="90" width="600" height="230" rx="12" fill="#F4F3EF" fill-opacity="0.04" stroke="#F4F3EF" stroke-opacity="0.1"/>
  <circle cx="644" cy="114" r="5" fill="#E24B4A" fill-opacity="0.6"/>
  <circle cx="662" cy="114" r="5" fill="#F2A93C" fill-opacity="0.6"/>
  <circle cx="680" cy="114" r="5" fill="#3FB9A6" fill-opacity="0.6"/>
  <text x="1180" y="118" font-size="10" fill="#C9C7BE" text-anchor="end" fill-opacity="0.5">agent.ts</text>
  <g font-size="13" fill="#C9C7BE">
    <text class="code-line cl1" x="644" y="150"><tspan fill="#F2A93C">async function</tspan> buildDreams() {</text>
    <text class="code-line cl2" x="664" y="176">const goal = <tspan fill="#3FB9A6">"ship agentic AI"</tspan>;</text>
    <text class="code-line cl3" x="664" y="202">while (!goal.achieved) {</text>
    <text class="code-line cl4" x="684" y="228">await learn(); await build();</text>
    <text class="code-line cl5" x="664" y="254">}</text>
    <text class="code-line cl6" x="644" y="280">}</text>
  </g>
  <rect class="code-line cl6 cursor2" x="656" y="270" width="7" height="13" fill="#3FB9A6"/>

  <!-- bottom-right contact line, mirrors the terminal line at top -->
  <g class="footer-line">
    <text x="1232" y="340" font-size="11" fill="#C9C7BE" text-anchor="end" fill-opacity="0.6">github.com/HarinirajanT</text>
  </g>

  <!-- scanner sweep -->
  <rect x="0" y="-40" width="1280" height="40" fill="url(#scanGrad)">
    <animate attributeName="y" values="-40;365" dur="3.5s" repeatCount="indefinite"/>
  </rect>
</g>
</svg>
