<svg width="320" height="440" viewBox="0 0 320 440" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<defs>
  <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#141A20"/>
    <stop offset="100%" stop-color="#0E1216"/>
  </linearGradient>
  <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#F4F3EF" stop-opacity="0"/>
    <stop offset="45%" stop-color="#F4F3EF" stop-opacity="0.18"/>
    <stop offset="55%" stop-color="#F4F3EF" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#F4F3EF" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="avatarRing" cx="50%" cy="50%" r="50%">
    <stop offset="70%" stop-color="#F2A93C" stop-opacity="0"/>
    <stop offset="100%" stop-color="#F2A93C" stop-opacity="0.6"/>
  </radialGradient>
  <clipPath id="cardClip"><rect x="60" y="150" width="200" height="260" rx="16"/></clipPath>
</defs>

<g id="swing">
  <!-- strap -->
  <rect x="150" y="0" width="20" height="150" fill="#F2A93C"/>
  <text x="160" y="0" font-size="9" fill="#0E1216" font-family="monospace" text-anchor="middle" transform="rotate(90 160 30)">HARINI · T · AGENTIC AI</text>

  <!-- clasp -->
  <circle cx="160" cy="152" r="10" fill="#8A8A85"/>
  <circle cx="160" cy="152" r="5" fill="#0E1216"/>
  <rect x="150" y="158" width="20" height="14" rx="6" fill="#8A8A85"/>

  <!-- card -->
  <rect x="60" y="150" width="200" height="260" rx="16" fill="url(#cardBg)" stroke="#F4F3EF" stroke-opacity="0.1"/>

  <g clip-path="url(#cardClip)">
    <!-- avatar placeholder with initials -->
    <circle cx="160" cy="230" r="42" fill="url(#avatarRing)"/>
    <circle cx="160" cy="230" r="34" fill="#1B2128" stroke="#F2A93C" stroke-width="1.5"/>
    <text x="160" y="240" font-size="24" fill="#F4F3EF" font-family="'Trebuchet MS',sans-serif" font-weight="700" text-anchor="middle">HT</text>

    <text x="160" y="292" font-size="16" fill="#F4F3EF" font-family="'Trebuchet MS',sans-serif" font-weight="700" text-anchor="middle">Harini T</text>
    <text x="160" y="310" font-size="11" fill="#3FB9A6" font-family="monospace" text-anchor="middle"> AI ENGINEER</text>
    <text x="160" y="326" font-size="10" fill="#C9C7BE" font-family="monospace" text-anchor="middle">@HarinirajanT</text>

    <!-- barcode -->
    <g fill="#F4F3EF" fill-opacity="0.7">
      <rect x="90" y="350" width="2" height="24"/><rect x="95" y="350" width="1" height="24"/>
      <rect x="99" y="350" width="3" height="24"/><rect x="105" y="350" width="1" height="24"/>
      <rect x="109" y="350" width="2" height="24"/><rect x="114" y="350" width="1" height="24"/>
      <rect x="118" y="350" width="3" height="24"/><rect x="124" y="350" width="2" height="24"/>
      <rect x="129" y="350" width="1" height="24"/><rect x="133" y="350" width="2" height="24"/>
      <rect x="138" y="350" width="1" height="24"/><rect x="142" y="350" width="3" height="24"/>
      <rect x="148" y="350" width="1" height="24"/><rect x="152" y="350" width="2" height="24"/>
      <rect x="157" y="350" width="1" height="24"/><rect x="161" y="350" width="3" height="24"/>
      <rect x="167" y="350" width="2" height="24"/><rect x="172" y="350" width="1" height="24"/>
      <rect x="176" y="350" width="2" height="24"/><rect x="181" y="350" width="1" height="24"/>
      <rect x="185" y="350" width="3" height="24"/><rect x="191" y="350" width="2" height="24"/>
      <rect x="196" y="350" width="1" height="24"/><rect x="200" y="350" width="2" height="24"/>
      <rect x="205" y="350" width="1" height="24"/><rect x="209" y="350" width="3" height="24"/>
      <rect x="215" y="350" width="1" height="24"/><rect x="219" y="350" width="2" height="24"/>
    </g>

    <!-- holographic shine sweep -->
    <rect x="-100" y="150" width="120" height="260" fill="url(#shine)" transform="rotate(20 60 280)">
      <animateTransform attributeName="transform" type="translate" values="-40 0;340 0;-40 0" dur="4s" repeatCount="indefinite" additive="sum"/>
    </rect>
  </g>
</g>

<!-- pendulum swing: drop-in with damping, then gentle idle sway forever -->
<animateTransform xlink:href="#swing" attributeName="transform" type="rotate"
  values="0 160 0;-14 160 0;10 160 0;-6 160 0;3 160 0;-1.5 160 0;0 160 0"
  keyTimes="0;0.15;0.35;0.55;0.72;0.86;1"
  dur="2.6s" fill="freeze" id="drop"/>
<animateTransform xlink:href="#swing" attributeName="transform" type="rotate"
  values="0 160 0;2.5 160 0;0 160 0;-2.5 160 0;0 160 0"
  dur="5s" begin="drop.end" repeatCount="indefinite" additive="sum"/>
</svg>
