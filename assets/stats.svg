<svg width="480" height="200" viewBox="0 0 480 200" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <clipPath id="statsClip"><rect width="480" height="200" rx="16"/></clipPath>
</defs>
<style>
  text{font-family:'JetBrains Mono',monospace;}
  .row{opacity:0;animation:slide .5s ease forwards;}
  .r1{animation-delay:.2s;} .r2{animation-delay:.4s;} .r3{animation-delay:.6s;} .r4{animation-delay:.8s;}
  @keyframes slide{from{opacity:0;transform:translateX(-14px);}to{opacity:1;transform:translateX(0);}}
</style>
<g clip-path="url(#statsClip)">
  <rect width="480" height="200" fill="#0E1216"/>
  <rect width="480" height="200" fill="none" stroke="#F4F3EF" stroke-opacity="0.08" rx="16"/>
  <text x="24" y="36" font-size="14" fill="#F4F3EF" font-weight="700">GitHub Stats</text>

  <!-- rank ring -->
  <circle cx="400" cy="100" r="52" fill="none" stroke="#F4F3EF" stroke-opacity="0.08" stroke-width="10"/>
  <circle cx="400" cy="100" r="52" fill="none" stroke="#F2A93C" stroke-width="10" stroke-linecap="round"
    stroke-dasharray="326" stroke-dashoffset="326" transform="rotate(-90 400 100)">
    <animate attributeName="stroke-dashoffset" from="326" to="95" dur="1.6s" fill="freeze"/>
  </circle>
  <text x="400" y="94" font-size="20" fill="#F4F3EF" text-anchor="middle" font-weight="700">B+</text>
  <text x="400" y="112" font-size="9" fill="#C9C7BE" text-anchor="middle">RANK</text>

  <g font-size="13" fill="#C9C7BE">
    <text class="row r1" x="24" y="76">Total Repos</text><text class="row r1" x="180" y="76" fill="#F4F3EF">18</text>
    <text class="row r2" x="24" y="102">Total Commits</text><text class="row r2" x="180" y="102" fill="#F4F3EF">240+</text>
    <text class="row r3" x="24" y="128">Contributed Repos</text><text class="row r3" x="180" y="128" fill="#F4F3EF">6</text>
    <text class="row r4" x="24" y="154">Current Streak</text><text class="row r4" x="180" y="154" fill="#3FB9A6">12 days</text>
  </g>
  <text x="24" y="184" font-size="9" fill="#C9C7BE" fill-opacity="0.6">update these numbers periodically — static values</text>
</g>
</svg>
