<svg width="640" height="120" viewBox="0 0 640 120" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#F4F3EF" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<style>
  text{font-family:'JetBrains Mono',monospace;}
  .pip{transition:all .3s;}
  .n1 .pip{animation:glow 4.5s infinite;}
  .n2 .pip{animation:glow 4.5s infinite 1.5s;}
  .n3 .pip{animation:glow 4.5s infinite 3s;}
  @keyframes glow{
    0%,20%{fill:#1B2128;stroke:#4A4A46;}
    5%,15%{fill:#F2A93C;stroke:#F2A93C;}
    100%{fill:#1B2128;stroke:#4A4A46;}
  }
  .n1 .lbl{animation:lblglow 4.5s infinite;}
  .n2 .lbl{animation:lblglow 4.5s infinite 1.5s;}
  .n3 .lbl{animation:lblglow 4.5s infinite 3s;}
  @keyframes lblglow{
    0%,20%{fill:#C9C7BE;}
    5%,15%{fill:#F2A93C;}
    100%{fill:#C9C7BE;}
  }
</style>
<rect width="640" height="120" rx="12" fill="#0E1216" stroke="#F4F3EF" stroke-opacity="0.08"/>
<text x="24" y="30" font-size="11" fill="#3FB9A6">// how I build</text>

<g class="n1">
  <circle class="pip" cx="90" cy="70" r="9" stroke-width="2"/>
  <text class="lbl" x="90" y="98" font-size="12" text-anchor="middle">observe</text>
</g>
<line x1="112" y1="70" x2="278" y2="70" stroke="#F4F3EF" stroke-opacity="0.25" stroke-width="1" marker-end="url(#arrow)"/>

<g class="n2">
  <circle class="pip" cx="300" cy="70" r="9" stroke-width="2"/>
  <text class="lbl" x="300" y="98" font-size="12" text-anchor="middle">reason</text>
</g>
<line x1="322" y1="70" x2="488" y2="70" stroke="#F4F3EF" stroke-opacity="0.25" stroke-width="1" marker-end="url(#arrow)"/>

<g class="n3">
  <circle class="pip" cx="510" cy="70" r="9" stroke-width="2"/>
  <text class="lbl" x="510" y="98" font-size="12" text-anchor="middle">act</text>
</g>

<path d="M 510 82 Q 510 110 300 110 Q 90 110 90 82" fill="none" stroke="#F4F3EF" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
</svg>
